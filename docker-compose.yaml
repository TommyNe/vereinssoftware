services:
    app:
        build:
            context: .
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
            dockerfile: Dockerfile
        container_name: vereinssoftware_app
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - .:/app
        environment:
            SERVER_NAME: ":80"
        depends_on:
            postgres:
                condition: service_healthy
        tty: true

    postgres:
        image: postgres:17-alpine
        container_name: vereinssoftware_postgres
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE:-vereinssoftware}
            POSTGRES_USER: ${DB_USERNAME:-vereinssoftware}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vereinssoftware}"]
            interval: 5s
            timeout: 5s
            retries: 5

    valkey:
        image: valkey/valkey:8-alpine
        restart: unless-stopped
        command: >
            valkey-server
            --appendonly yes
            --appendfsync everysec
        volumes:
            - valkey_data:/data
        networks:
            - app

volumes:
    valkey_data:
    postgres_data:

networks:
    app:
