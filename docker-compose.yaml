services:
    app:
        image: vereinssoftware-app
        build:
            context: .
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
            dockerfile: Dockerfile
        container_name: vereinssoftware_app
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - .:/app
        environment:
            SERVER_NAME: ":80"
        depends_on:
            postgres:
                condition: service_healthy
        tty: true

    queue:
        image: vereinssoftware-app
        restart: unless-stopped
        volumes:
            - .:/app
        entrypoint: ["php", "artisan", "queue:work"]
        command: ["--sleep=3", "--tries=3", "--timeout=60", "--no-interaction"]
        healthcheck:
            disable: true
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_started

    postgres:
        image: postgres:17-alpine
        container_name: vereinssoftware_postgres
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE:-vereinssoftware}
            POSTGRES_USER: ${DB_USERNAME:-vereinssoftware}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vereinssoftware}"]
            interval: 5s
            timeout: 5s
            retries: 5

    valkey:
        image: valkey/valkey:8-alpine
        restart: unless-stopped
        command: >
            valkey-server
            --appendonly yes
            --appendfsync everysec
        volumes:
            - valkey_data:/data
        networks:
            - app

    mailpit:
        image: axllent/mailpit
        container_name: mailpit
        restart: unless-stopped
        volumes:
            - mailpit_data:/data
        ports:
            - 8025:8025
            - 1025:1025
        environment:
            MP_MAX_MESSAGES: 5000
            MP_DATABASE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
    valkey_data:
    postgres_data:
    mailpit_data:
        driver: local
networks:
    app:
