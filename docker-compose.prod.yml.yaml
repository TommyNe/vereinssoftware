services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: vereinssoftware_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_storage:/app/storage
    environment:
      SERVER_NAME: ${APP_DOMAIN}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://${APP_DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    depends_on:
      postgres:
        condition: service_healthy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.vereinssoftware.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.vereinssoftware.entrypoints=websecure"
      - "traefik.http.routers.vereinssoftware.tls=true"
      - "traefik.http.routers.vereinssoftware.tls.certresolver=le"
      - "traefik.http.routers.vereinssoftware.priority=100"
      - "traefik.http.routers.vereinssoftware.service=vereinssoftware"
      - "traefik.http.services.vereinssoftware.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.vereinssoftware-sslproxy.headers.sslproxyheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.vereinssoftware.middlewares=vereinssoftware-sslproxy"
    networks:
      - internal
      - traefik_public

  postgres:
    image: postgres:17-alpine
    container_name: vereinssoftware_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  app_storage:

networks:
  internal:
    driver: bridge
  traefik_public:
    external: true
