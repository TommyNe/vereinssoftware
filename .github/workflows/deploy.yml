name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image metadata
        shell: bash
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -H "${{ secrets.DEPLOY_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Create deployment environment
        shell: bash
        env:
          APP_NAME: ${{ vars.APP_NAME || 'Laravel' }}
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_DEBUG: "false"
          APP_URL: ${{ vars.APP_URL }}

          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}

          MAIL_MAILER: ${{ vars.MAIL_MAILER || 'log' }}
          MAIL_HOST: ${{ vars.MAIL_HOST || '127.0.0.1' }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '2525' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS || 'hello@example.com' }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || vars.APP_NAME || 'Laravel' }}

        run: |
          {
            printf 'APP_IMAGE=%q\n' "${IMAGE_NAME}:${IMAGE_TAG}"

            printf 'APP_NAME=%q\n' "$APP_NAME"
            printf 'APP_ENV=%q\n' "$APP_ENV"
            printf 'APP_KEY=%q\n' "$APP_KEY"
            printf 'APP_DEBUG=%q\n' "$APP_DEBUG"
            printf 'APP_URL=%q\n' "$APP_URL"

            printf 'DB_DATABASE=%q\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%q\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%q\n' "$DB_PASSWORD"

            printf 'REDIS_PASSWORD=%q\n' "$REDIS_PASSWORD"

            printf 'LOG_LEVEL=%q\n' "$LOG_LEVEL"

            printf 'MAIL_MAILER=%q\n' "$MAIL_MAILER"
            printf 'MAIL_HOST=%q\n' "$MAIL_HOST"
            printf 'MAIL_PORT=%q\n' "$MAIL_PORT"
            printf 'MAIL_USERNAME=%q\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%q\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM_ADDRESS=%q\n' "$MAIL_FROM_ADDRESS"
            printf 'MAIL_FROM_NAME=%q\n' "$MAIL_FROM_NAME"
          } > .deploy.env

      - name: Create production Docker context
        shell: bash
        run: |
          docker context rm production --force || true

          docker context create production \
            --docker "host=ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PORT }}"

      - name: Test remote Docker connection
        run: |
          docker --context production info

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -a
          source ./.deploy.env
          set +a

          docker --context production compose \
            -f docker-compose.deploy.yml \
            pull

          docker --context production compose \
            -f docker-compose.deploy.yml \
            up -d --remove-orphans

      - name: Run Laravel migrations
        shell: bash
        run: |
          set -a
          source ./.deploy.env
          set +a

          docker --context production compose \
            -f docker-compose.deploy.yml \
            exec -T app \
            php artisan migrate --force

      - name: Laravel optimization
        shell: bash
        run: |
          set -a
          source ./.deploy.env
          set +a

          docker --context production compose \
            -f docker-compose.deploy.yml \
            exec -T app \
            php artisan optimize

      - name: Cleanup
        if: always()
        run: |
          rm -f .deploy.env
          docker context rm production --force || true
