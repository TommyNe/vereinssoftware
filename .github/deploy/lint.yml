name: Linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos

  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Run Laravel Pint
        run: composer lint

      - name: Check frontend formatting
        run: npm run format

      - name: Lint frontend
        run: npm run lint
