services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped

    volumes:
      - app_storage:/app/storage

    environment:
      SERVER_NAME: ":8000"

      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://${APP_DOMAIN}

      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      REDIS_CLIENT: phpredis
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

    labels:
      - "traefik.enable=true"

      - "traefik.docker.network=traefik_public"

      - "traefik.http.routers.vereinssoftware.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.vereinssoftware.entrypoints=websecure"
      - "traefik.http.routers.vereinssoftware.tls=true"
      - "traefik.http.routers.vereinssoftware.tls.certresolver=le"

      - "traefik.http.routers.vereinssoftware.service=vereinssoftware"
      - "traefik.http.services.vereinssoftware.loadbalancer.server.port=8000"

      - "traefik.http.middlewares.vereinssoftware-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.vereinssoftware.middlewares=vereinssoftware-headers"

    networks:
      - internal
      - traefik_public

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - valkey_data:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - internal

volumes:
  postgres_data:
  app_storage:
  valkey_data:

networks:
  internal:
    driver: bridge

  traefik_public:
    external: true
